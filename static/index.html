<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EventOps Agent — event room (M1)</title>
<style>
:root{--bg:#faf6ef;--card:#fffdf8;--ink:#33302a;--soft:#8a8478;--accent:#b3541e;--line:#e8ddcb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:26px;margin:8px 0}small{color:var(--soft)}
#log{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:10px;background:#f4ecdd;max-width:100%}
.msg.agent{background:#e9f3e4;border:1px solid #cfe3c6}
.msg.system{background:transparent;color:var(--soft);font-style:italic}
.row{display:flex;gap:8px;margin-top:10px}
input,button{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
input{flex:1;background:#fff}button{background:var(--accent);color:#fff;border:none;cursor:pointer}
button:disabled{opacity:.6}
.hint{font-size:14px;color:var(--soft)}
code{background:#f1e8d5;padding:1px 6px;border-radius:6px}
</style></head><body><div class="wrap">
<h1>🎪 EventOps Agent <small>event room · M1</small></h1>
<div class="card">
<div class="row">
<input id="name" placeholder="Your name (e.g. Asha)" value="Asha"/>
<button id="join">Join room</button>
</div>
<p class="hint">Try: <code>@agent research backup caterers</code> ·
<code>@agent draft a message to the team</code> ·
<code>@agent call the caterer</code> · <code>@agent export csv</code></p>
</div>
<div class="card"><div id="log"></div>
<div class="row"><input id="text" placeholder="Chat here… tag @agent for help"/>
<button id="send">Send</button></div>
<p class="hint" id="status">Not connected.</p>
</div></div>
<script>
let ws=null, name="Asha";
const log=document.getElementById('log'), status=document.getElementById('status');
function add(sender,text){
 const d=document.createElement('div');
 d.className='msg '+(sender==='agent'?'agent':sender==='system'?'system':'');
 d.innerHTML='<b></b> <span></span>';
 d.querySelector('b').textContent=sender+':';
 d.querySelector('span').textContent=' '+text;
 log.appendChild(d); log.scrollTop=log.scrollHeight;
}
document.getElementById('join').onclick=()=>{
 name=document.getElementById('name').value||'guest';
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>{status.textContent='Connected as '+name; add('system','Joined as '+name);};
 ws.onmessage=e=>{const m=JSON.parse(e.data); add(m.sender,m.text);};
 ws.onclose=()=>{status.textContent='Disconnected. Re-join to reconnect.';};
};
function send(){
 const i=document.getElementById('text');
 if(!ws||ws.readyState!==1){add('system','Join the room first.');return;}
 ws.send(JSON.stringify({sender:name,text:i.value})); i.value='';
}
document.getElementById('send').onclick=send;
document.getElementById('text').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
// load history
fetch('/api/event').then(r=>r.json()).then(d=>{
 (d.messages||[]).forEach(m=>add(m.sender,m.text));
}).catch(()=>{});
</script></body></html>
